name: Apply drawing audit

on:
  push:
    branches:
      - fix/redraw-coloring-templates-light-only
    paths:
      - .github/workflows/apply-drawing-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/redraw-coloring-templates-light-only

      - name: Wire audited templates and enforce light mode
        shell: python
        run: |
          from pathlib import Path
          import re

          drawing = Path("src/DrawingGame.jsx")
          text = drawing.read_text()

          import_line = 'import { TEMPLATES } from "./drawingTemplates";\n'
          if import_line not in text:
              text = text.replace(
                  'import { useRef, useState } from "react";\n',
                  'import { useRef, useState } from "react";\n' + import_line,
                  1,
              )

          text, count = re.subn(
              r'const TEMPLATES = \[.*?\n\];\n\nfunction TemplateArt',
              'function TemplateArt',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected to replace one local template library, replaced {count}")
          drawing.write_text(text)

          layout = Path("app/layout.jsx")
          layout_text = layout.read_text()
          layout_text = layout_text.replace(
              '<html lang="en-PH">',
              '<html lang="en-PH" style={{ colorScheme: "light" }}>',
              1,
          )
          layout.write_text(layout_text)

      - name: Commit generated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DrawingGame.jsx app/layout.jsx
          git diff --cached --quiet || git commit -m "fix: use audited coloring templates and force light mode"
          git push origin HEAD:fix/redraw-coloring-templates-light-only
