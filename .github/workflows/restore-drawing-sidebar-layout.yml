name: Restore drawing sidebar layout

on:
  push:
    branches:
      - fix/restore-drawing-sidebar-layout

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-drawing-sidebar-layout
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore previous drawing layout
        run: node scripts/run-restore-drawing-sidebar-layout.mjs

      - name: Build
        run: npm run build

      - name: Commit restored layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DrawingGame.jsx src/DrawingWorkspace.css
          git commit -m "fix: restore drawing board sidebar layout"
          git push origin fix/restore-drawing-sidebar-layout
