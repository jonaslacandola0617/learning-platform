name: Import 4x coloring templates

on:
  push:
    branches:
      - replace-coloring-templates-4x

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: replace-coloring-templates-4x
          fetch-depth: 0

      - name: Reconstruct 4x vector template library
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/drawingTemplates-*.b64 | base64 --decode | xz --decompress > src/drawingTemplates.js
          grep -q 'sourceSize: { width: 3200, height: 2080 }' src/drawingTemplates.js
          test "$(grep -c '^    id:' src/drawingTemplates.js)" -eq 20

      - name: Build Tuklas
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit imported templates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm .github/workflows/import-4x-coloring-templates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace coloring templates with 4x vector artwork"
          git push origin HEAD:replace-coloring-templates-4x
