name: Apply template polish

on:
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/polish-coloring-templates-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refine drawing stroke weights
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.css')
          text = p.read_text()
          text = text.replace('.drawing-mode-options svg g { stroke-width:17px; }', '.drawing-mode-options svg g { stroke-width:8px; }')
          text = text.replace('.coloring-page-options svg g { stroke-width:13px; }', '.coloring-page-options svg g { stroke-width:7.5px; }')
          text = text.replace('.coloring-outline { pointer-events:none; }', '.coloring-outline { pointer-events:none; stroke-width:7.5px; }')
          p.write_text(text)
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.css
          git commit -m "style: refine coloring template stroke weights" || exit 0
          git push origin HEAD:fix/polish-coloring-templates-v2
