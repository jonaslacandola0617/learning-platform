name: Use existing game menus

on:
  push:
    branches:
      - fix/use-existing-game-menus

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/use-existing-game-menus
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove extra game menu layer
        run: |
          node scripts/remove-extra-game-menu.mjs
          rm src/GameMenu.module.css

      - name: Build
        run: npm run build

      - name: Commit corrected navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use existing setup screens as game menus"
          git push origin fix/use-existing-game-menus
